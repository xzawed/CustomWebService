sonar.projectKey=xzawed_CustomWebService
sonar.organization=xzawed

sonar.sources=src
sonar.exclusions=src/test/**,src/**/*.test.ts,src/**/*.test.tsx,src/__tests__/**
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/__tests__/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# page/layout 컴포넌트 및 테스트 미적용 라우트는 커버리지 집계에서 제외
sonar.coverage.exclusions=src/app/**/page.tsx,src/app/**/layout.tsx,src/app/api/v1/generate/regenerate/route.ts,src/components/builder/RePromptPanel.tsx

sonar.sourceEncoding=UTF-8
