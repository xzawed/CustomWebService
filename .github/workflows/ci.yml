name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 문서 정합성 — 트리거·경로·명령어는 테스트도 lint도 안 잡는 유일한 문서 요소다.
  # 실제로 죽어 있던 것이 2건 나왔다(ENV_VAR_DENYLIST · isNotFound).
  #
  # ⚠️ needs 체인에 넣지 않는다(독립 잡). 또 최소 1주기는 continue-on-error로 둔다.
  # 이유: 이 레포는 main에 브랜치 보호가 없고 Railway가 Wait for CI를 쓴다 —
  # 문서 결함이 워크플로를 red로 만들면 **다음 코드 배포가 SKIPPED**되고,
  # SKIPPED는 CI를 다시 green으로 만들어도 되살아나지 않는다.
  # 관측 1주기 후 continue-on-error를 떼는 것은 별도 판단으로 한다.
  docs-integrity:
    name: Docs Integrity
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # exit 1 = 문서 위반 / exit 2 = 검사기 자체 고장. 둘을 합치지 말 것.
      - name: Check documentation integrity
        run: pnpm docs:check

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 프로덕션 트리는 무조건 클린이어야 한다 — 런타임에 실제로 실려나가는 코드.
      - name: Security audit (production tree)
        run: pnpm audit --prod --audit-level=high

      # 전체 트리(dev 포함). 상위 패키지 최신 버전에도 픽스가 없는 dev 전용 건은
      # package.json의 pnpm.auditConfig.ignoreGhsas에 근거를 남기고 면제한다.
      # 면제 목록은 docs/security/audit-waivers.md에서 관리·재검토.
      - name: Security audit (full tree, reviewed waivers)
        run: pnpm audit --audit-level=high

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm type-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      # sonarcloud-github-action은 공식 deprecated(CI 로그에 경고 출력) → sonarqube-scan-action.
      # 드롭인 대체이나 SonarCloud를 가리키려면 SONAR_HOST_URL을 명시해야 한다.
      - name: SonarQube Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build application
        run: pnpm build
        env:
          # NEXT_PUBLIC_* is inlined at build time — must be present here, not only on the test step.
          # Without NEXT_PUBLIC_ROOT_DOMAIN, middleware never inspects Host → subdomain rewrite is dead.
          NEXT_PUBLIC_ROOT_DOMAIN: xzawed.xyz
          NEXT_PUBLIC_AUTH_PROVIDER: local

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          # 컷오버 이후 instrumentation이 getSqliteDb()를 무조건 호출하므로,
          # E2E 런타임 서버(pnpm start)가 부팅하려면 SQLite env가 필요하다.
          # (테스트 전용 값 — 프로덕션과 무관)
          DB_PROVIDER: sqlite
          SQLITE_PATH: /tmp/e2e-app.db
          SQLITE_BACKUP_ENABLED: 'false'
          AUTH_SECRET: e2e-ci-secret-not-for-production
          AUTH_TRUST_HOST: 'true'
          # http:// so Auth.js session cookies are not Secure-only against plain CI HTTP.
          AUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ROOT_DOMAIN: xzawed.xyz
          NEXT_PUBLIC_AUTH_PROVIDER: local

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
