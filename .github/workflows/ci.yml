name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 수동 실행 — 웹훅이 죽었을 때의 **유일한 복구 수단**이다.
  #
  # 2026-08-06 GitHub Actions 장애(major_outage)에서 웹훅의 15%만 처리돼
  # main 머지 3건 중 **CI 런이 1건만 생성**됐다. `FAILED`도 `SKIPPED`도 아닌
  # **"런 부재"** 라 배포 목록에는 아무 흔적이 없었고, 그 결과 코드 PR 2건이
  # **CI를 한 번도 통과하지 않은 채 병합·배포**됐다(그중 하나에 Linux에서
  # 실패하는 테스트가 있었고, 다음 PR에 CI가 붙고 나서야 발견됐다).
  #
  # 그때 `gh workflow run` 은 422로 거부됐다 — 이 트리거가 없었기 때문이다.
  # 웹훅은 우회할 수 없지만 dispatch 는 API 직접 호출이라 살아 있다.
  #
  # 사용: `gh workflow run "CI / CD" --ref <branch>`
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # **main 은 취소하지 않는다.** PR 브랜치는 마지막 푸시만 의미가 있으므로 취소가 옳지만,
  # main 은 **커밋 하나하나가 배포 대상**이다. 취소하면 그 커밋은 CI 없이 배포된다.
  #
  # 실측(2026-08-07): 최근 main 커밋 6개 중 **성공 런이 있는 것은 2개뿐**이었다.
  #   b70aa97 0건 · 183bca6 0건(취소 ×2) · 38f531b 1건 · 9199cec 0건(취소)
  #   · 8dbbc3c 1건 · 6f2c7c1 0건(웹훅 장애로 런 자체가 생성 안 됨)
  # 연달아 머지하면 앞 커밋의 런이 뒤 커밋 푸시에 취소되고, 취소된 커밋도 Railway 는 배포한다.
  # 즉 **"CI 통과했다"가 커밋 단위로는 거짓**이 될 수 있었다.
  #
  # 대가: main 에 연속 머지 시 CI 분(minutes)이 더 든다. 검증 공백보다 싸다.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # 문서 정합성 — 트리거·경로·명령어는 테스트도 lint도 안 잡는 유일한 문서 요소다.
  # 실제로 죽어 있던 것이 2건 나왔다(ENV_VAR_DENYLIST · isNotFound).
  #
  # ⚠️ needs 체인에 넣지 않는다(독립 잡).
  #
  # **PR 에서는 red 가 되고, main push 에서는 red 가 되지 않는다.**
  #   · main push 를 red 로 만들면 Railway 의 Wait for CI 가 **다음 코드 배포를 SKIPPED** 로
  #     만들고, SKIPPED 는 CI 를 다시 green 으로 만들어도 되살아나지 않는다.
  #   · 반면 **Railway 는 PR 런을 보지 않는다**(배포 대상 브랜치의 체크만 본다).
  #     따라서 PR 에서 red 가 돼도 배포 위험이 없다.
  #
  # ⚠️ **"머지를 막는다"고 읽지 말 것 — 막지 않는다.**
  # 2026-08-08 실측: main 에는 활성 ruleset `PRIMARY` 가 있고(deletion · non_fast_forward ·
  # pull_request), 그 안에 **`required_status_checks` 규칙이 0개**다. 즉 이 잡이 red 여도
  # 머지 버튼도 `gh pr merge` 도 막히지 않는다. 이 설정이 하는 일은 **위반을 PR 에서 빨갛게
  # 보이게 하는 것**까지다.
  #
  # 그 전 커밋(#303)은 "PR 에서 차단하게 한다"고 적었는데, 근거로 든 것이
  # `/branches/main/protection` 의 404 였다. **그 404 는 레거시 API 가 ruleset 을 모를 뿐**이고
  # 보호가 없다는 뜻이 아니었다 — CLAUDE.md G2 가 경고하는 프록시 지표 오독 그 자체다.
  # 실제로 머지를 막으려면 ruleset `PRIMARY` 에 `required_status_checks` 로 이 잡을 추가해야
  # 한다(**오너 액션** — WBS H2).
  docs-integrity:
    name: Docs Integrity
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # exit 1 = 문서 위반 / exit 2 = 검사기 자체 고장. 둘을 합치지 말 것.
      - name: Check documentation integrity
        run: pnpm docs:check

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 프로덕션 트리는 무조건 클린이어야 한다 — 런타임에 실제로 실려나가는 코드.
      - name: Security audit (production tree)
        run: pnpm audit --prod --audit-level=high

      # 전체 트리(dev 포함). 상위 패키지 최신 버전에도 픽스가 없는 dev 전용 건은
      # package.json의 pnpm.auditConfig.ignoreGhsas에 근거를 남기고 면제한다.
      # 면제 목록은 docs/security/audit-waivers.md에서 관리·재검토.
      - name: Security audit (full tree, reviewed waivers)
        run: pnpm audit --audit-level=high

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm type-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      # sonarcloud-github-action은 공식 deprecated(CI 로그에 경고 출력) → sonarqube-scan-action.
      # 드롭인 대체이나 SonarCloud를 가리키려면 SONAR_HOST_URL을 명시해야 한다.
      - name: SonarQube Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build application
        run: pnpm build
        env:
          # NEXT_PUBLIC_* is inlined at build time — must be present here, not only on the test step.
          # Without NEXT_PUBLIC_ROOT_DOMAIN, middleware never inspects Host → subdomain rewrite is dead.
          NEXT_PUBLIC_ROOT_DOMAIN: xzawed.xyz
          NEXT_PUBLIC_AUTH_PROVIDER: local

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          # 컷오버 이후 instrumentation이 getSqliteDb()를 무조건 호출하므로,
          # E2E 런타임 서버(pnpm start)가 부팅하려면 SQLite env가 필요하다.
          # (테스트 전용 값 — 프로덕션과 무관)
          DB_PROVIDER: sqlite
          SQLITE_PATH: /tmp/e2e-app.db
          SQLITE_BACKUP_ENABLED: 'false'
          AUTH_SECRET: e2e-ci-secret-not-for-production
          AUTH_TRUST_HOST: 'true'
          # http:// so Auth.js session cookies are not Secure-only against plain CI HTTP.
          AUTH_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ROOT_DOMAIN: xzawed.xyz
          NEXT_PUBLIC_AUTH_PROVIDER: local

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
