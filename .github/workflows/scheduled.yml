name: Scheduled API Health Check

on:
  schedule:
    # Daily at 21:00 UTC (06:00 KST next day)
    - cron: '0 21 * * *'
  workflow_dispatch:

# DB(api_catalog)에서 활성 API 전체를 읽어 업스트림을 라이브 검증한다.
# (이전: 8개 하드코딩 + 삭제된 API·구도메인 테스트 → DB 기반으로 전환, 드리프트 제거)
permissions:
  contents: read

jobs:
  api-health-check:
    name: API Health Check (DB-driven)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run catalog health check
        id: healthcheck
        run: pnpm catalog:healthcheck > health-report.json
        env:
          # 읽기는 anon 키로 충분 (RLS "Anyone can view active APIs").
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-health-report
          path: |
            health-report.json
            verification-report.json
          retention-days: 14

      # 실패(BROKEN 1개 이상 → exit 1) 시: 중복 방지하며 GitHub Issue 생성/갱신
      - name: Open or update issue on broken APIs
        if: failure() && steps.healthcheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="🚨 카탈로그 API 헬스체크 실패 (BROKEN 감지)"
          # broken 목록 추출 (verification-report.json은 스크립트가 생성)
          BROKEN=$(jq -r '.apis[] | select(.overallStatus=="broken") | "- **\(.name)** (\(.category)) — \(.endpoints[] | select(.status=="broken") | .reason) [\(.baseUrl)]"' verification-report.json 2>/dev/null | sort -u || echo "(상세 파싱 실패 — 아티팩트 확인)")
          BODY=$(cat <<EOF
          일일 카탈로그 헬스체크에서 **BROKEN** API가 감지되었습니다. (run: ${{ github.run_id }})

          $BROKEN

          - 전체 리포트: 이 워크플로 실행의 \`catalog-health-report\` 아티팩트
          - 대응: 업스트림 상태 확인 → \`deprecated_at\` 설정/대체 → \`pnpm catalog:healthcheck:write\`로 상태 동기화
          - 자세한 절차: docs/decisions/2026-06-21-api-catalog-health-monitoring.md
          EOF
          )
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
